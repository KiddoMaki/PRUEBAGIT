name: Publicar prueba1 en GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio prueba1
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./prueba1
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4